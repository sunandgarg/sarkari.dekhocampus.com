name: Verify Sarkari DekhoCampus production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scope cancellation by ref so a rejected manual run on another branch
  # cannot cancel the valid main production verifier.
  group: sarkari-dekhocampus-production-${{ github.ref }}
  # The public alias can expose only one immutable revision at a time. A newer
  # main push makes an older verifier obsolete, so do not let stale runs poll
  # until timeout after Cloudflare has already advanced.
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - name: Require the production main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Sarkari production verification can run only from main." >&2
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify and build the Sarkari portal
        env:
          VITE_API_URL: https://aws-origin.dekhocampus.com
          VITE_AWS_API_URL: https://aws-origin.dekhocampus.com
          VITE_MEDIA_BASE_URL: https://aws-origin.dekhocampus.com/storage/v1/object/public
          SITEMAP_API_URL: https://aws-origin.dekhocampus.com
          SITEMAP_BASE_URL: https://sarkari.dekhocampus.com
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          rm -f dist/_worker.js
          test ! -e dist/_worker.js
          test -s dist/sitemap.xml
          test -s dist/sitemap-1.xml
          grep -Fq "<sitemapindex" dist/sitemap.xml
          grep -Fq "<urlset" dist/sitemap-1.xml
          grep -Fq "https://sarkari.dekhocampus.com" dist/sitemap.xml
          grep -Fq "Sitemap: https://sarkari.dekhocampus.com/sitemap.xml" dist/robots.txt
          ! grep -R -Fq "127.0.0.1:8787" dist/assets

      # This repository is connected directly to its dedicated Cloudflare Pages
      # project. Wait for that independent deployment and fail closed if the
      # custom domain does not expose this workflow's immutable revision.
      - name: Verify the connected Cloudflare Pages deployment
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            BUILD_ID=$(curl --fail --silent --show-error --max-time 15 \
              https://sarkari.dekhocampus.com/version.json \
              | jq -r '.buildId' || true)
            if [ "$BUILD_ID" = "$EXPECTED_SHA" ]; then exit 0; fi
            sleep 5
          done
          echo "The Sarkari Pages deployment did not publish the expected build." >&2
          exit 1
