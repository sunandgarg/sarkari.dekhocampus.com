  <body>
    <!-- SARKARI_HOME_PRERENDER_START -->
    <div id="root" data-sarkari-prerender="home"><div id="sarkari-home-prerender-placeholder"></div></div>
    <!-- SARKARI_HOME_PRERENDER_END -->
    <script>
      (() => {
        const root = document.getElementById("root");
        if (!root) return;
        const exactHome = window.location.pathname === "/" && window.location.search === "";
        const normalizedPath = window.location.pathname.replace(/\/+$/, "") || "/";
        const legalPaths = [
          "/legal/privacy-policy",
          "/legal/cookie-policy",
          "/legal/terms-of-service",
          "/legal/disclaimer",
          "/legal/editorial-corrections"
        ];
        const prerenderMarker = root.getAttribute("data-sarkari-prerender");
        const hasHomePrerender = exactHome && prerenderMarker === "home";
        const hasLegalPrerender = legalPaths.includes(normalizedPath)
          && prerenderMarker === `legal:${normalizedPath}`;
        if (!hasHomePrerender && !hasLegalPrerender) {
          root.replaceChildren();
          root.removeAttribute("data-sarkari-prerender");
        }
      })();
    </script>
